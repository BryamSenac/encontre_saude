<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- API LEAFET -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!---------->
    <link rel="stylesheet" href="./farmacias.css">
    <script type="module" src="./farmacias.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


</head>

<body>
    <header id="header"></header>
    <main>
        <div class="map-controls">
            <button class="loc-btn" id="locBtn">📍 Minha Localização</button>
            <button class="menuBtn" id="menuBtn">☰ Farmácias</button>
        </div>

        <div id="map"></div>

        <aside class="sideebar" id="sideebar">
            <h2>Farmácias em Francisco Beltrão</h2>
            <div class="filter">
                <input type="text" id="search" placeholder="Pesquisar farmácia...">
                <select id="bairro"></select>
                <div class="tipo-filtros">
                    <button id="btnMunicipal" class="tipo-btn active">Municipais</button>
                    <button id="btnPrivada" class="tipo-btn active">Privadas</button>
                </div>
            </div>
            <div id="farmacias-list"></div>
        </aside>
    </main>

</body>

</html>
