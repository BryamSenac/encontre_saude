<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontre Saúde - Meu Perfil</title>
    <!-- Fontes e Icones -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./perfil.css">
    <script type="module" src="./perfil.js" defer></script>
</head>
<body>
    <header id="header"></header>

    <main class="perfil-main">
        <div class="perfil-container">
            <div class="perfil-card">
                <div class="perfil-header">
                    <div class="avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <h2>Perfil do Usuário</h2>
                    <p class="status-badge"><i class="fas fa-check-circle"></i> Conta Verificada</p>
                </div>
                
                <div class="perfil-info">
                    <div class="info-group">
                        <label>Nome Completo</label>
                        <p id="userName">Usuário Teste</p>
                    </div>
                    <div class="info-group">
                        <label>E-mail</label>
                        <p id="userEmail">usuario@teste.com</p>
                    </div>
                </div>

                <div class="perfil-actions">
                    <button class="btn-logout" id="btnLogout">
                        <i class="fas fa-sign-out-alt"></i> Sair da Conta
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
